<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="솜이 피아노">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>솜이 피아노 교실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 디자인 방향(장르: playful): 피아노 건반이 이 앱의 재료다. 버튼은 건반처럼 아래 모서리가 있고 눌리면 내려가며,
   한 주의 연습은 건반 일곱 개에 불이 켜지는 것으로 보인다. 면은 그림자·테두리 대신 한 단계 다른 색으로 나누고,
   그라데이션·유리·네온은 쓰지 않는다. 역할 색: 베리(누를 것), 하늘(두 번째 동작), 민트(다 함), 버터(보상).
   레이아웃: 한 화면 앱. 위에는 화면 콘텐츠, 아래에는 탭 바. 연습 화면은 탭 바를 숨기고 건반을 화면 아래에 붙인다. */
:root{
  --bg:#FFF5F9; --bg2:#FCE8F1; --card:#FFFFFF; --ink:#3A2340; --ink2:#7A6080; --line:#F2D8E5;
  --pink:#E0438A; --pink-soft:#FFE1EE; --berry-edge:#A9255F;
  --sky:#2F8FD6; --sky-soft:#E1F1FC; --sky-edge:#1F6AA3;
  --mint:#24B383; --butter:#FFBE2E; --butter-edge:#D6960A;
  --tile-1:#1F86C9; --tile-2:#1E9E6A; --tile-3:#D9661A; --tile-4:#D63A6E;
  --key:#FFFFFF; --key-edge:#E9D3E3; --black:#3B2547; --shadow:none;
  --c-C:#FF5C7A; --c-D:#FF9640; --c-E:#F5C400; --c-F:#3FCB7A; --c-G:#3BAEF5; --c-A:#6E7BFF; --c-B:#B86CF5;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1420; --bg2:#2A2130; --card:#241C2B; --ink:#FFF0F6; --ink2:#C9B2CF; --line:#3B2F43;
  --pink-soft:#46243A; --berry-edge:#8E1E50; --sky-soft:#1E3346; --sky-edge:#174F7A; --butter-edge:#A87405;
  --key:#FFF8FC; --key-edge:#BFA6C9; --black:#120A1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1420; --bg2:#2A2130; --card:#241C2B; --ink:#FFF0F6; --ink2:#C9B2CF; --line:#3B2F43;
  --pink-soft:#46243A; --berry-edge:#8E1E50; --sky-soft:#1E3346; --sky-edge:#174F7A; --butter-edge:#A87405;
  --key:#FFF8FC; --key-edge:#BFA6C9; --black:#120A1A; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:22px} h3{font-size:18px}
.app{max-width:780px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.screen{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border-radius:22px;padding:18px}
.row{display:flex;gap:12px;align-items:center}
.muted{color:var(--ink2)}
/* 버튼 = 건반: 아래 모서리(5px)가 있고, 누르면 그만큼 내려간다 */
.btn{font-family:var(--display);font-size:18px;padding:12px 22px;min-height:48px;border-radius:999px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--berry-edge);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 1px 0 var(--berry-edge)}
.btn.alt{background:var(--sky);box-shadow:0 5px 0 var(--sky-edge)}
.btn.alt:active:not([disabled]){box-shadow:0 1px 0 var(--sky-edge)}
.btn.gold{background:var(--butter);color:#3A2340;box-shadow:0 5px 0 var(--butter-edge)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.ghost:active:not([disabled]){box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.ic{display:inline-block;vertical-align:-.18em;flex:none}

/* 홈 */
.hello{display:flex;gap:14px;align-items:flex-end}
.bubble{position:relative;background:var(--card);border-radius:22px 22px 22px 6px;padding:14px 16px;flex:1;min-width:0}
.bubble b{font-family:var(--display);font-weight:400;font-size:20px;display:block;color:var(--pink)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{background:var(--card);border-radius:18px;padding:10px;text-align:center}
.chip b{font-family:var(--display);font-weight:400;font-size:26px;display:block;font-variant-numeric:tabular-nums}
.chip span{font-size:13px;color:var(--ink2)}
.allclear{background:var(--butter);color:#3A2340;text-align:center;font-family:var(--display);font-size:19px;border-radius:18px;padding:12px}

/* 홈: 히어로(솜이·레벨) → 이번 주 건반 → 오늘의 퀘스트 길 → 놀이터 */
.hero{background:var(--pink-soft);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:14px}
.hero .bubble{background:var(--card)}
.lv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.lv .badge{grid-row:span 2;width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:24px;line-height:1;box-shadow:0 4px 0 var(--berry-edge)}
.lv .badge small{display:block;font-size:11px;opacity:.9}
.lv b{font-family:var(--display);font-weight:400;font-size:19px}
.lvbar{height:14px;border-radius:99px;background:var(--card);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--pink);border-radius:99px;transition:width .6s}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--card);font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.wkeys{display:flex;gap:4px;align-items:flex-start}
.wkey{flex:1;height:96px;border-radius:0 0 12px 12px;background:var(--key);border:2px solid var(--key-edge);border-top-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:8px;font-size:12px;color:#7A6080;position:relative}
.wkey.on{background:#FFC6DE;border-color:#F3A3C6;color:#7A1F4C}
.wkey.gold{background:var(--butter);border-color:var(--butter-edge);color:#5C3B00}
.wkey.frz{background:#CFE8FA;border-color:#9ACAEB;color:#1F4E73}
.wkey.today{box-shadow:inset 0 -6px 0 var(--pink)}
.wkey .ic{color:inherit}
.streakline{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.streakline .big{font-family:var(--display);font-size:34px;color:var(--pink);line-height:1;font-variant-numeric:tabular-nums}
.quest{display:flex;flex-direction:column}
.qrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:8px 0;position:relative}
.qrow::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:6px;background:var(--bg2)}
.qrow:first-child::before{top:50%} .qrow:last-child::before{bottom:50%}
.qrow.done::before{background:#BFE9D8}
.qnode{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);color:var(--ink2);position:relative;z-index:1}
.qrow.done .qnode{background:var(--mint);color:#fff}
.qrow.now .qnode{background:var(--pink);color:#fff;box-shadow:0 0 0 6px var(--pink-soft)}
.qrow .txt{min-width:0}
.qrow .txt b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.qrow .txt span{font-size:14px;color:var(--ink2)}
.qrow.done .txt b{color:var(--ink2)}
.qrow.chest .qnode{background:var(--bg2);color:var(--ink2)}
.qrow.chest.ready .qnode{background:var(--butter);color:#5C3B00;animation:chestwiggle 2.4s ease-in-out infinite}
.qrow.chest.opened .qnode{background:var(--mint);color:#fff}
@keyframes chestwiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
.goalline{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.goalline .lvbar{flex:1;background:var(--bg2);height:10px}
.goalline .lvbar i{background:var(--mint)}
.arcade{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{position:relative;border-radius:22px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:148px;text-align:left;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);transition:transform .08s}
.tile:active:not([disabled]){transform:translateY(3px)}
.tile b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.tile span{font-size:13px;line-height:1.35;opacity:.95}
.tile .ic{margin-bottom:auto}
.tile[disabled]{background:var(--bg2)!important;color:var(--ink2);box-shadow:none;cursor:not-allowed}
@media (max-width:360px){.arcade{grid-template-columns:1fr}}
/* 보상 순간: 레벨 업, 보물상자 */
.reward-pop{display:flex;flex-direction:column;align-items:center;gap:10px}
.reward-pop .big{font-family:var(--display);font-size:44px;color:var(--pink);line-height:1}
.jump{animation:jump .9s ease-out 1}
@keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-18px)}55%{transform:translateY(0)}72%{transform:translateY(-6px)}100%{transform:translateY(0)}}

/* 지도 */
.path{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.path::before{content:"";position:absolute;left:50%;top:30px;bottom:30px;border-left:6px dotted var(--sky);opacity:.5;transform:translateX(-3px)}
.stop{position:relative;display:flex}
.stop:nth-child(4n+1){justify-content:center}
.stop:nth-child(4n+2){justify-content:flex-end;padding-right:8%}
.stop:nth-child(4n+3){justify-content:center}
.stop:nth-child(4n){justify-content:flex-start;padding-left:8%}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;text-align:center}
.disc{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--card);border:4px solid var(--pink);box-shadow:0 6px 0 var(--berry-edge);transition:transform .1s}
.disc:active{transform:translateY(4px);box-shadow:0 2px 0 var(--berry-edge)}
.node.locked .disc{border-color:var(--line);box-shadow:0 6px 0 var(--line);filter:grayscale(1);opacity:.6;cursor:default}
.node.next .disc{animation:bob 1.6s ease-in-out infinite}
.node .nm{font-family:var(--display);font-size:16px;line-height:1.2;background:var(--bg);padding:2px 8px;border-radius:10px}
.stars{color:var(--butter);letter-spacing:2px;font-size:16px}
.stars .off{color:var(--line)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--sky-soft);color:var(--ink2)}
@keyframes bob{50%{transform:translateY(-6px)}}

/* 스티커 */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.stk{background:var(--card);border-radius:20px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.stk .em{font-size:42px;line-height:1.2}
.stk b{font-family:var(--display);font-weight:400;font-size:15px}
.stk span{font-size:12px;color:var(--ink2);line-height:1.3}
.stk.locked .em{filter:grayscale(1) brightness(1.4);opacity:.25}
.stk.got{border-color:var(--pink);background:var(--pink-soft)}

/* 어른 */
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--pink)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 72px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--bg2);max-width:100%}
.cal .p{background:var(--pink-soft)} .cal .g{background:var(--pink)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px;max-height:220px;overflow:auto}
.log div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}

/* 탭 바 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
@media (max-width:420px){.tab{font-size:12px;padding:6px 2px}.stepper button{width:30px}.stepper output{min-width:2.4em}}
/* 키가 작은 휴대폰 화면에서도 연습 화면이 한 화면에 들어오게 */
@media (max-height:840px){body.playing .kb{height:150px}body.playing #lane{height:210px}body.playing .stage{min-height:200px}body.playing .app{gap:10px}}

/* 곡 연습실 */
.lvtabs{display:flex;gap:6px;flex-wrap:wrap}
.setname{font-family:var(--display);font-size:16px;color:var(--ink2);margin-top:6px}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.piece{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:16px;background:var(--card);min-height:44px}
.piece b{font-family:var(--display);font-weight:400;font-size:17px}
.piece span{font-size:13px;color:var(--ink2)}
@media (hover:hover){.piece:hover{background:var(--pink-soft)}}
.labhead{display:flex;align-items:center;gap:12px}
.labhead .txt{flex:1;min-width:0}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl label{font-family:var(--display);min-width:3.2em}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--bg)}
.stepper button{width:34px;height:34px;font-size:18px}
.stepper output{min-width:3.2em;text-align:center;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.rollwrap{overflow-x:auto;max-width:100%;border-radius:14px;background:var(--bg2)}
#roll{display:block;height:200px}
.barmap{display:flex;flex-wrap:wrap;gap:6px}
.barchip{min-width:52px;padding:6px 8px;border-radius:12px;text-align:center;font-family:var(--display);font-size:15px;color:#fff;line-height:1.15}
.barchip small{display:block;font-family:var(--body);font-size:11px;opacity:.9}
.barchip.g{background:var(--mint)} .barchip.y{background:var(--butter);color:var(--ink)} .barchip.r{background:var(--pink)}
.barchip[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.recbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;border-radius:18px;background:var(--bg2);text-align:center}
.recbig{font-family:var(--display);font-size:56px;line-height:1;color:var(--pink)}
.plan{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:1.4em}
.plan li{padding:2px 0}
.takes{display:flex;flex-direction:column;gap:4px;font-size:14px}
.takes div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:3px}
.tab{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px;border-radius:16px;font-family:var(--display);font-size:14px;color:var(--ink2)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:var(--pink-soft);color:var(--pink)}

/* 연습 화면 */
body.playing .tabs{display:none}
body.playing .app{padding-block:12px 12px}
.playtop{display:flex;align-items:center;gap:10px}
.x{width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:22px;display:grid;place-items:center;flex:none}
.prog{flex:1;height:18px;border-radius:99px;background:var(--bg2);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pink);border-radius:99px;transition:width .3s}
.ptitle{font-family:var(--display);font-size:20px;text-align:center}
.stage{position:relative;min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--card);border-radius:24px;overflow:hidden}
.target{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:56px;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);animation:pop .35s}
.prompt{font-family:var(--display);font-size:20px;text-align:center;padding:0 12px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
#lane{display:block;width:100%;height:260px}
.songbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.speed{display:flex;gap:4px;background:var(--bg2);border-radius:99px;padding:4px}
.speed button{padding:6px 12px;border-radius:99px;font-size:14px;font-family:var(--display)}
.speed button[aria-pressed="true"]{background:var(--card);color:var(--pink);box-shadow:0 2px 0 var(--line)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--card);z-index:2;text-align:center;padding:16px}
.staff{width:min(320px,90%);height:auto}

/* 건반 */
.kbwrap{margin-top:auto;padding-top:14px}
.kb{position:relative;display:flex;height:190px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wk{flex:1;position:relative;background:var(--key);border:2px solid var(--key-edge);border-top:0;border-radius:0 0 14px 14px;margin:0 1px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:10px;gap:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06);transition:background .1s}
.wk .dot{width:22px;height:22px;border-radius:50%}
.wk .lb{font-family:var(--display);font-size:17px;color:#5A3D69;line-height:1}
.wk.hide-lb .lb{visibility:hidden}
.bk{position:absolute;top:0;width:7%;height:60%;background:var(--black);border-radius:0 0 10px 10px;z-index:2;box-shadow:inset 0 -6px 0 rgba(255,255,255,.12)}
.wk.down{background:var(--pink-soft);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.bk.down{background:#6B4A7E}
.wk.glow{animation:glow 1s ease-in-out infinite}
.bk.glow{animation:glowb 1s ease-in-out infinite}
@keyframes glow{50%{background:#FFF0A8;box-shadow:0 0 0 4px var(--butter) inset}}
@keyframes glowb{50%{background:#C9A33A}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* 결과 */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(74,45,92,.45);padding:16px}
.modal .card{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.bigstars{font-size:52px;letter-spacing:6px}
.bigstars span{display:inline-block;color:var(--line);animation:none}
.bigstars span.on{color:var(--butter);animation:pop .5s backwards}
.newstk{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:40px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--bg2);font-size:14px;font-variant-numeric:tabular-nums}
.combo{font-family:var(--display);font-size:16px;color:#fff;background:var(--butter);padding:4px 12px;border-radius:99px;flex:none;animation:pop .3s}
.compose{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;padding:12px 8px;box-sizing:border-box}
.staffwrap{overflow-x:auto;max-width:100%;width:100%;scroll-behavior:smooth}
.staffwrap svg{display:block}
.compose input{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:12em;max-width:100%}
.mysong{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:var(--bg2)}
.mysong .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.mysong .txt b{font-family:var(--display);font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mysong .txt span{font-size:13px;color:var(--ink2)}
.dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.moodbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;background:var(--bg2);border:2px solid var(--line);font-family:var(--display);font-size:18px}
.moodbtn span{font-size:40px;line-height:1.1}
.moodbtn small{font-family:var(--body);font-size:12px;color:var(--ink2)}
.moodbtn:hover{border-color:var(--pink)}
button.pill{border:2px solid var(--line);cursor:pointer}
.medals{font-size:15px;letter-spacing:2px}
.medals .off{filter:grayscale(1);opacity:.3}
.judge{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:20px;color:var(--pink);background:var(--card);padding:2px 14px;border-radius:99px;pointer-events:none;animation:pop .3s;white-space:nowrap}
.judge:empty{display:none}
.dyncard{width:170px;height:170px;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:#fff;animation:pop .35s}
.dyncard span{font-size:72px;line-height:1.1}
.dynmeter{position:relative;width:min(320px,90%);height:22px;border-radius:99px;background:var(--bg2);overflow:hidden}
.dynmeter i{position:absolute;inset:0 auto 0 0;background:var(--pink);border-radius:99px;transition:width .15s}
.dynmeter b{position:absolute;top:0;bottom:0;width:3px;background:var(--ink2)}
.guide{max-width:100%}
.guide svg{max-width:100%;height:auto}
details.help summary{cursor:pointer;color:var(--ink2);font-size:14px}
.btn.sm{font-size:14px;padding:7px 12px;flex:none}
.micpill{font-family:var(--display);font-size:15px;padding:4px 12px;border-radius:99px;background:var(--bg2);color:var(--ink2);flex:none;transition:background .1s}
.micpill.hot{background:var(--mint);color:#fff}
.meter{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--mint);transition:width .08s}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:25;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-family:var(--display);font-size:17px;max-width:calc(100% - 32px);text-align:center;animation:pop .3s}
.reward{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 상점 */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.item .em{font-size:40px;line-height:1.2}
.item b{font-family:var(--display);font-weight:400;font-size:17px}
.item span{font-size:13px;color:var(--ink2);line-height:1.35}
.item .btn{font-size:15px;padding:8px 16px;margin-top:auto}
.item.on{border-color:var(--pink);background:var(--pink-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--bg);font-family:var(--display)}
.seg button[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.xpweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.xpweek div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--ink2)}
.xpweek i{display:block;width:70%;border-radius:8px 8px 3px 3px;background:var(--sky);min-height:3px}
.xpweek .hit i{background:var(--pink)}
@media (max-width:480px){.kb{height:150px}.wk .lb{font-size:14px}.wk .dot{width:16px;height:16px}.disc{width:70px;height:70px;font-size:28px}.node{width:120px}#lane{height:220px}.target{width:110px;height:110px;font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(() => {
"use strict";
const KEY = "somi-piano-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- 음 ---------- */
const NOTES = [
  ["C4",60,"도","C"],["C#4",61,"도♯",null],["D4",62,"레","D"],["D#4",63,"레♯",null],["E4",64,"미","E"],
  ["F4",65,"파","F"],["F#4",66,"파♯",null],["G4",67,"솔","G"],["G#4",68,"솔♯",null],["A4",69,"라","A"],
  ["A#4",70,"시♭",null],["B4",71,"시","B"],["C5",72,"높은 도","C"],["C#5",73,"도♯",null],["D5",74,"높은 레","D"],
  ["D#5",75,"레♯",null],["E5",76,"높은 미","E"]
].map(([id,midi,name,letter]) => ({id,midi,name,letter,white:!!letter,short:letter?name.replace("높은 ",""):""}));
const N = Object.fromEntries(NOTES.map(n => [n.id,n]));
const colorOf = id => { const n = N[id]; return n.letter ? `var(--c-${n.letter})` : "var(--black)"; };
const hasBatchim = w => { const c = w.charCodeAt(w.length-1); return c>=0xAC00 && c<=0xD7A3 && (c-0xAC00)%28!==0; };
const eul = w => w + (hasBatchim(w) ? "을" : "를");
const KEYMAP = {a:"C4",w:"C#4",s:"D4",e:"D#4",d:"E4",f:"F4",t:"F#4",g:"G4",y:"G#4",h:"A4",u:"A#4",j:"B4",k:"C5",o:"C#5",l:"D5",p:"D#5",";":"E5"};

/* ---------- 노래 (모두 저작권이 끝난 전래·고전 선율) ---------- */
const SONGS = {
  plane:  {name:"떴다 떴다 비행기", tempo:1, seq:"E4 D4 C4 D4 E4 E4 E4:2 D4 D4 D4:2 E4 G4 G4:2 E4 D4 C4 D4 E4 E4 E4:2 D4 D4 E4 D4 C4:4"},
  nabi:   {name:"나비야", tempo:1, seq:"G4 E4 E4:2 F4 D4 D4:2 C4 D4 E4 F4 G4 G4 G4:2 G4 E4 E4:2 F4 D4 D4:2 C4 E4 G4 G4 E4 E4 E4:2"},
  twinkle:{name:"반짝반짝 작은 별", tempo:1, seq:"C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2 G4 G4 F4 F4 E4 E4 D4:2 C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2"},
  joy:    {name:"환희의 송가", tempo:1, seq:"E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:.5 C4:2"},
  bday:   {name:"생일 축하 노래", tempo:1, seq:"C4:.75 C4:.25 D4 C4 F4 E4:2 C4:.75 C4:.25 D4 C4 G4 F4:2 C4:.75 C4:.25 C5 A4 F4 E4 D4:2 A#4:.75 A#4:.25 A4 F4 G4 F4:2"}
};
function parseSong(s){ let t=0; return s.split(/\s+/).map(tok => { const [id,d] = tok.split(":"); const dur = d?parseFloat(d):1; const o = {note:id,start:t,dur}; t+=dur; return o; }); }

/* ---------- 레슨 길 (DeepTutor의 '숙달 경로'처럼 한 단계씩 열림) ---------- */
const LESSONS = [
  {id:"l1", icon:"🌷", title:"도·레·미 친구들", kind:"find", notes:["C4","D4","E4"], rounds:8, tip:"건반 색깔을 잘 봐!"},
  {id:"l2", icon:"✈️", title:"떴다 떴다 비행기", kind:"song", song:"plane"},
  {id:"l3", icon:"🐣", title:"파·솔 등장", kind:"find", notes:["C4","D4","E4","F4","G4"], rounds:10},
  {id:"l4", icon:"🦋", title:"나비야", kind:"song", song:"nabi"},
  {id:"l5", icon:"🐰", title:"귀 쫑긋 소리 찾기", kind:"ear", notes:["C4","E4","G4"], rounds:6, tip:"소리를 듣고 같은 건반을 찾아봐"},
  {id:"l6", icon:"🌙", title:"라·시·높은 도", kind:"find", notes:["C4","D4","E4","F4","G4","A4","B4","C5"], rounds:10},
  {id:"l7", icon:"⭐", title:"반짝반짝 작은 별", kind:"song", song:"twinkle"},
  {id:"l8", icon:"🎀", title:"오선지 읽기", kind:"staff", notes:["C4","D4","E4","F4","G4","A4","B4","C5"], rounds:10, tip:"음표가 높이 있을수록 높은 소리야"},
  {id:"l9", icon:"🎻", title:"환희의 송가", kind:"song", song:"joy"},
  {id:"l10",icon:"🎂", title:"생일 축하 노래", kind:"song", song:"bday", tip:"검은 건반이 처음 나와!"}
];
const LI = Object.fromEntries(LESSONS.map((l,i)=>[l.id,i]));

const STICKERS = [
  ["first","🎹","첫 연주","아무 연습이나 끝내기"],
  ["composer","🎼","작곡가","내 노래 처음 저장하기"],
  ["cheetah","🐆","치타 피아니스트","노래를 치타 빠르기로 별 3개"],
  ["sight","🔮","악보 탐정","깜짝 악보를 실수 없이 치기"],
  ["stage","🎤","연주회 스타","연주회 모드로 노래 별 3개"],
  ["dyn","🦁","셈여림 박사","셈여림 놀이 별 3개"],
  ["recorder","🎙️","녹음 연주가","곡 연습실에서 처음 녹음하기"],
  ["allgreen","🌟","초록 마디","녹음한 마디가 모두 초록"],
  ["mission1","🍓","퀘스트 클리어","오늘의 퀘스트 3개 모두 하기"],
  ["perfect","💖","실수 0개","한 번도 안 틀리고 끝내기"],
  ["s3","🌈","3일 연속","3일 연속 연습하기"],
  ["s7","🦄","7일 연속","7일 연속 연습하기"],
  ["s14","👑","14일 연속","14일 연속 연습하기"],
  ["s30","🏰","30일 연속","30일 연속 연습하기"],
  ["d5","🍰","5일 연습","연습한 날 5일 모으기"],
  ["d15","💎","15일 연습","연습한 날 15일 모으기"],
  ...LESSONS.map(l => [l.id, l.icon, l.title, "별 3개 받기"])
];

/* ---------- 저장 ---------- */
function fresh(){ return {v:1,name:"",settings:{labels:true,sound:true,goal:20},stars:{},notes:{},days:{},stickers:[],log:[],
  placed:false,placeLevel:0,songs:[],speed:{},perf:{},lab:{},xp:0,gems:10,freezes:0,owned:["ribbon-pink"],outfit:{ribbon:"ribbon-pink",hat:null,wand:null},phrases:{},notice:null,updatedAt:Date.now()}; }

/* ---------- 보석 상점 (듀오링고의 '연속 기록 방패'와 꾸미기 아이템) ---------- */
const SHOP = [
  {id:"freeze", em:"🛡️", name:"연속 기록 방패", price:20, desc:"하루 쉬어도 연속 기록을 지켜 줘요. 최대 2개"},
  {id:"ribbon-pink", slot:"ribbon", val:"#FF6FAE", em:"🎀", name:"분홍 리본", price:0, desc:"솜이가 처음 매고 온 리본"},
  {id:"ribbon-lilac", slot:"ribbon", val:"#A98BFF", em:"💜", name:"보라 리본", price:15, desc:"솜이 귀에 보라 리본"},
  {id:"ribbon-mint", slot:"ribbon", val:"#4FCFAE", em:"💚", name:"민트 리본", price:15, desc:"솜이 귀에 민트 리본"},
  {id:"hat-flower", slot:"hat", val:"flower", em:"🌸", name:"꽃 화관", price:30, desc:"알록달록 꽃으로 만든 화관"},
  {id:"hat-crown", slot:"hat", val:"crown", em:"👑", name:"반짝 왕관", price:50, desc:"피아노 공주님의 왕관"},
  {id:"wand", slot:"wand", val:true, em:"🪄", name:"별 요술봉", price:40, desc:"솜이가 별 요술봉을 들어요"}
];
const SI = Object.fromEntries(SHOP.map(s=>[s.id,s]));
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return merge(JSON.parse(r)); }catch(e){}
  return fresh();
}
function merge(o){
  const f = fresh(), s = Object.assign(f, o, {settings:Object.assign(f.settings, o.settings||{}), outfit:Object.assign(f.outfit, o.outfit||{})});
  // 백업 코드는 밖에서 붙여 넣는 값이라, 화면에 그리는 목록은 모양을 확인하고 이상한 항목은 버린다
  const isDay = d => typeof d === "string" && /^\d{4}-\d{2}-\d{2}$/.test(d);
  s.songs = (Array.isArray(s.songs) ? s.songs : []).filter(x => x && typeof x.title === "string" && isDay(x.d) && Array.isArray(x.notes) && x.notes.length
    && x.notes.every(n => n && N[n.n] && [0.5,1,1.5,2].includes(n.b))).map(x => ({id:+x.id||0, title:x.title.slice(0,16), d:x.d, notes:x.notes.map(n=>({n:n.n, b:n.b}))}));
  s.log = (Array.isArray(s.log) ? s.log : []).filter(e => e && isDay(e.d) && typeof e.t === "string").map(e => ({d:e.d, t:e.t.slice(0,40), s:Math.max(0,Math.min(3,+e.s||0)), a:Math.max(0,Math.min(100,Math.round(+e.a||0)))}));
  s.stickers = (Array.isArray(s.stickers) ? s.stickers : []).filter(id => STICKERS.some(x=>x[0]===id));
  s.owned = (Array.isArray(s.owned) ? s.owned : []).filter(id => SI[id]); if(!s.owned.includes("ribbon-pink")) s.owned.push("ribbon-pink");
  ["ribbon","hat","wand"].forEach(k => { if(s.outfit[k] && !SI[s.outfit[k]]) s.outfit[k] = f.outfit[k]; });
  s.settings.goal = [10,20,30].includes(+s.settings.goal) ? +s.settings.goal : 20;
  const days = {}; Object.entries(s.days && typeof s.days === "object" ? s.days : {}).forEach(([k,d]) => { if(!isDay(k) || !d || typeof d !== "object") return;
    days[k] = {sessions:+d.sessions||0, minutes:+d.minutes||0, xp:+d.xp||0, missions:Object.fromEntries(["warm","lesson","review","sight","piece"].map(x=>[x,!!d.missions?.[x]])),
      ...(d.frozen?{frozen:true}:{}), ...(d.chestOpened?{chestOpened:true}:{}), ...(["great","ok","tired"].includes(d.mood)?{mood:d.mood}:{}),
      ...(Array.isArray(d.plan) && d.plan.length && d.plan.every(x=>["warm","lesson","review","sight","piece"].includes(x)) ? {plan:d.plan.slice()} : {})}; });
  s.days = days;
  // 곡 연습실 기록: 숫자만 남긴다
  const num = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(+v || 0)));
  s.lab = Object.fromEntries(Object.entries(s.lab && typeof s.lab === "object" ? s.lab : {}).filter(([k,v]) => /^\d+$/.test(k) && v && Array.isArray(v.takes)).map(([k,v]) => [k, {
    takes: v.takes.filter(t => t && isDay(t.d)).slice(-40).map(t => ({d:t.d, a:num(t.a,1,999), b:num(t.b,1,999), hand:["both",0,1].includes(t.hand)?t.hand:"both", score:num(t.score,0,100), acc:num(t.acc,0,100), bpm:num(t.bpm,10,400),
      bars:Object.fromEntries(Object.entries(t.bars && typeof t.bars === "object" ? t.bars : {}).filter(([b]) => /^\d+$/.test(b)).map(([b,x]) => [b, num(x,0,100)]))}))}]));
  s.perf = Object.fromEntries(Object.keys(s.perf && typeof s.perf === "object" ? s.perf : {}).filter(k => SONGS[k] && s.perf[k] === true).map(k => [k, true]));
  s.speed = Object.fromEntries(Object.entries(s.speed && typeof s.speed === "object" ? s.speed : {}).filter(([k,v]) => SONGS[k] && [0,1,2].includes(v)));

const TITLES = [[1,"새싹"],[3,"꽃봉오리"],[6,"꽃"],[10,"무지개"],[15,"별"],[21,"달"],[28,"은하수"]];
function levelOf(xp){
  let L = 1, acc = 0, need = 60; while(xp >= acc + need){ acc += need; L++; need = 40 + 20*L; }
  return {L, into: xp - acc, need, title: TITLES.filter(t => L >= t[0]).pop()[1] + " 피아니스트"};
}

function popup(html, onClose){

function openChest(){
  const d = today(); if(!allDone(dkey()) || d.chestOpened) return;
  const gems = mood().chest + Math.floor(Math.random()*4); d.chestOpened = true; S.gems += gems; d.xp = (d.xp||0) + 10; S.xp += 10; save();
  popup(`<div class="jump" style="color:var(--butter-edge)">${ic("chest", 96, 1.8)}</div><h2>보물상자를 열었어!</h2>
    <div class="reward"><span class="stat" style="color:var(--sky)">${ic("gem",18)}<span style="color:var(--ink)">+${gems}</span></span><span class="stat" style="color:var(--butter-edge)">${ic("star",18)}<span style="color:var(--ink)">+10 XP</span></span></div>
    <span class="muted">오늘 퀘스트를 모두 해낸 선물이야</span>`, renderHome);
}
function levelUp(from, lv){
  const gained = lv.L - from, gems = 5*gained, oldTitle = TITLES.filter(t => from >= t[0]).pop()[1];
  S.gems += gems; S.levelSeen = lv.L; save();
  const newTitle = !lv.title.startsWith(oldTitle);
  popup(`<div class="jump">${bunny(96)}</div><div class="big">Lv.${lv.L}</div><h2>레벨 업!</h2>
    ${newTitle ? `<b style="font-family:var(--display);font-weight:400;font-size:20px">이제 '${lv.title}'야!</b>` : `<span class="muted">${lv.title}</span>`}
    <div class="reward"><span class="stat" style="color:var(--sky)">${ic("gem",18)}<span style="color:var(--ink)">+${gems}</span></span></div>`, renderHome);
}

/* 이번 주(오늘 포함 7일) 연습을 가족에게 보낼 글로 정리한다 */
function weeklyReport(){
  const days = Array.from({length:7}, (_,i) => dkey(addDays(new Date(), i-6))), dd = days.map(k => S.days[k] || {});
  const md = k => k.slice(5).replace("-","/"), name = S.name || "우리 아이";
  const practicedN = days.filter(practiced).length, xp = dd.reduce((a,d)=>a+(d.xp||0),0), mins = Math.round(dd.reduce((a,d)=>a+(d.minutes||0),0));
  const crowns = days.filter(allDone).length, logs = S.log.filter(e => days.includes(e.d));
  const lines = [`🎹 ${name}의 이번 주 피아노 연습 (${md(days[0])}~${md(days[6])})`, "",
    `• 연습한 날: ${practicedN}일 / 7일 (연속 ${streak()}일째)`, `• 퀘스트 모두 완료(왕관): ${crowns}일`, `• 모은 XP: ${xp} · 연습 시간: 약 ${mins}분 · 끝낸 연습: ${logs.length}개`];
  const pieces = Object.entries(S.lab).map(([id, r]) => ({id, p: LIB?.find(x => x.id === +id), tk: r.takes.filter(t => days.includes(t.d)), all: r.takes})).filter(x => x.tk.length);
  if(pieces.length){
    lines.push("", "🎼 곡 연습 (녹음 분석)");
    pieces.forEach(({id, p, tk, all}) => { const title = p ? [p.composer, p.title].filter(Boolean).join(" ") : `곡 ${id}`, best = Math.max(...tk.map(t=>t.score));
      const bars = [...new Set(tk.flatMap(t => Object.keys(t.bars)).map(Number))].sort((a,b)=>a-b);
      lines.push(`• ${title}: 녹음 ${tk.length}번, ${bars[0]}~${bars[bars.length-1]}마디, 최고 ${best}점, 빠르기 ♩=${tk[0].bpm}→${tk[tk.length-1].bpm}`);
      const h = barHistory(id), firstWeek = b => (h[b] || []).find(x => days.includes(x.d)), lastOf = b => (h[b] || []).slice(-1)[0];
      const up = bars.map(b => ({b, f:firstWeek(b)?.s, l:lastOf(b)?.s})).filter(x => x.f != null && x.l - x.f >= 10).sort((a,b)=>(b.l-b.f)-(a.l-a.f)).slice(0,3);
      if(up.length) lines.push(`  ↗ 나아진 마디: ${up.map(x => `${x.b}마디 ${x.f}→${x.l}점`).join(", ")}`);
      const weak = bars.filter(b => (lastOf(b)?.s ?? 100) < 70); if(weak.length) lines.push(`  ✎ 더 연습할 마디: ${weak.slice(0,4).join(", ")}마디`); });
  }
  const songs = S.songs.filter(s => days.includes(s.d)); if(songs.length) lines.push("", `🎵 직접 만든 노래: ${songs.map(s => `"${s.title}"`).join(", ")}`);
  const newStk = STICKERS.filter(s => S.stickers.includes(s[0])).length; lines.push("", `⭐ 스티커 ${newStk}개 · 보석 ${S.gems}개 모음`);
  lines.push(practicedN >= 5 ? "이번 주 정말 꾸준했어요! 칭찬 한마디 부탁드려요 😊" : practicedN >= 3 ? "꾸준히 하고 있어요. 응원 한마디가 큰 힘이 돼요 😊" : "이번 주는 조금 쉬었어요. 같이 한 곡 들어 주면 다시 신날 거예요 🎶");
  return lines.join("\n");
}

/* 마이크로 진짜 피아노 소리 듣기.

/* ---------- 내가 만든 노래 (RecogNotes처럼 연주를 악보로) ---------- */
const STAFF_ORDER = ["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5"];
/* ids: 음 목록, hi: 지금 칠 음(분홍 테두리)
   opt.durs: 박자(0.5 꼬리 달린 음표, 1 검은 음표, 1.5 점 음표, 2 흰 음표, 4 온음표) — 주면 4박마다 마디줄을 긋는다
   opt.plain: 아직 안 친 음표는 검게 그려 색 힌트 없이 읽게 하고, 친 음표만 색을 입힌다 */
function staffSeqSvg(ids, hi=-1, opt={}){
  const gap = 14, base = 112, x0 = 84, dx = 38, durs = opt.durs, w = Math.max(320, x0 + ids.length*dx + 16);
  const lines = [0,1,2,3,4].map(i=>`<line x1="10" x2="${w-6}" y1="${base-i*gap}" y2="${base-i*gap}" stroke="var(--ink2)" stroke-width="2"/>`).join("");
  let beat = 0, bars = "";
  const notes = ids.map((id,i) => { const x = x0 + i*dx, step = STAFF_ORDER.indexOf(id.replace("#","")) - 2, y = base - step*gap/2, up = step < 4;
    const b = durs ? durs[i] : 1, col = opt.plain && (hi < 0 || i >= hi) ? "var(--ink)" : colorOf(id.replace("#","")), hollow = b >= 2;
    beat += b; if(durs && i < ids.length-1 && Math.abs(beat % 4) < 1e-6) bars += `<line x1="${x+dx/2}" x2="${x+dx/2}" y1="${base-4*gap}" y2="${base}" stroke="var(--ink2)" stroke-width="2"/>`;
    const sx = up ? x+9 : x-9, sy = up ? y-40 : y+40;
    return `${step<=-2?`<line x1="${x-17}" x2="${x+17}" y1="${base+gap}" y2="${base+gap}" stroke="var(--ink2)" stroke-width="2"/>`:""}
      ${id.includes("#")?`<text x="${x-22}" y="${y+6}" font-size="20" fill="var(--ink)">♯</text>`:""}
      ${i===hi?`<ellipse cx="${x}" cy="${y}" rx="17" ry="14" fill="none" stroke="var(--pink)" stroke-width="3"/>`:""}
      <ellipse cx="${x}" cy="${y}" rx="10" ry="7.5" transform="rotate(-20 ${x} ${y})" fill="${hollow?"var(--card)":col}" stroke="${hollow?col:"var(--ink)"}" stroke-width="${hollow?3.5:1.5}"/>
      ${b===1.5?`<circle cx="${x+16}" cy="${y-3}" r="2.6" fill="var(--ink)"/>`:""}
      ${b<4?`<line x1="${sx}" x2="${sx}" y1="${y}" y2="${sy}" stroke="var(--ink)" stroke-width="2.2"/>`:""}
      ${b===0.5?`<path d="M${sx} ${sy} q 12 ${up?10:-10} 8 ${up?24:-24}" fill="none" stroke="var(--ink)" stroke-width="2.4"/>`:""}`; }).join("");
  const end = opt.end ? `<line x1="${w-14}" x2="${w-14}" y1="${base-4*gap}" y2="${base}" stroke="var(--ink2)" stroke-width="2"/><line x1="${w-8}" x2="${w-8}" y1="${base-4*gap}" y2="${base}" stroke="var(--ink)" stroke-width="5"/>` : "";
  return `<svg width="${w}" height="170" viewBox="0 0 ${w} 170" role="img" aria-label="음표 ${ids.length}개 악보">${lines}${bars}${end}
    <text x="14" y="${base+10}" font-size="78" fill="var(--ink)" font-family="'Segoe UI Symbol','Noto Music','Apple Symbols',serif">𝄞</text>${notes}</svg>`;
}

/* 셈여림 놀이 (Pianio의 셈여림 코칭을 마이크용으로).

             f:{em:"🦁", name:"크게", mark:"f 포르테", bg:"var(--pink)", ok:r => r > 1.4, again:"조금 더 크게, 쾅!"}};
function dynSetup(){ A.base = []; A.baseLv = 0; A.rounds = 8; A.round = 0; A.want = null; A.last = null; dynBase(); }
function dynBase(){

function dynMeter(){

}
function dynKey(id, el, loud){

/* 진짜 피아노에서 찾기 (AI Piano Tutor의 '악보 음 → 진짜 건반' 생각을 그림 한 장으로).
   업라이트 피아노는 대개 이름표(로고)나 열쇠 구멍이 가운데 도 근처에 있다. */
function middleCSvg(){
  const W = 20, x0 = 10, whites = 14, blk = [0,1,3,4,5];   // 도3~시4, 검은 건반은 도·레·파·솔·라 오른쪽

  for(let i=0;i<whites-1;i++) if(blk.includes(i%7)) keys += `<rect x="${x0+(i+1)*W-6}" y="60" width="12" height="55" rx="2" fill="${i===7||i===8?"#6B4A7E":"#3B2547"}"/>`;

    <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="var(--pink)"/></marker></defs>
    <text x="${cx}" y="140" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">도</text>
    <text x="${cx+30}" y="200" font-size="13" fill="var(--ink)">가운데 도</text></svg>

// 가운데 도에서 몇 칸인지 (진짜 피아노에서 음 자리 찾기)
function whereOnPiano(id){
  const n = STAFF_ORDER.indexOf(id.replace("#",""));
  const base = n===0 ? "가운데 도" : n===7 ? "가운데 도에서 오른쪽으로 7칸, 한 옥타브 위 도" : `가운데 도에서 오른쪽으로 ${n}칸`;

}
const dynOpen = () => !!S.settings.mic || !!midiName;

/* 솜이의 깜짝 악보 (초견 연습 사이트처럼 매번 새 악보). 배운 흰 건반만 쓰고, 주로 옆 음으로 움직이며, 4마디 끝은 도로 마친다. */
function makeSight(){
  const pool = learnedNotes().filter(id => N[id].white), rnd = a => a[Math.floor(Math.random()*a.length)];
  const R = [[1,1,1,1],[2,1,1],[1,1,2],[2,2],[1,1,1,1]], LAST = [[1,1,2],[2,2],[4]];
  let i = Math.floor(Math.random()*Math.min(3, pool.length)), t = 0; const seq = [];
  for(let bar=0; bar<4; bar++){ const rh = bar===3 ? rnd(LAST) : rnd(R);
    rh.forEach((b,j) => {
      if(seq.length){ const r = Math.random(), dir = Math.random() < .5 ? -1 : 1; i = Math.max(0, Math.min(pool.length-1, i + (r < .65 ? dir : r < .85 ? dir*2 : 0))); }
      if(bar===3 && j===rh.length-1){ const cs = ["C4","C5"].filter(c => pool.includes(c)); if(cs.length) i = pool.indexOf(cs.sort((a,b)=>Math.abs(pool.indexOf(a)-i)-Math.abs(pool.indexOf(b)-i))[0]); }
      seq.push({note:pool[i], start:t, dur:b}); t += b; }); }
  return seq;
}
function sightSetup(){

/* 친 간격을 박자로 바꾼다: 가운데 간격을 한 박으로 보고 반 박·한 박·한 박 반·두 박 중 가까운 것으로 맞춘다 */

  if(R) R.pairs.forEach(([i,j]) => { if(i < 0) return; const e = R.E[i]; e.notes.forEach(q => st.set(e.beat.toFixed(3)+":"+q.m, e.orn ? "orn" : j < 0 ? "miss" : R.P[j].ms.some(x => (x-q.m)%12 === 0) ? "ok" : "miss")); });
  ns.forEach(n => { const x = X(n[0]), y = Y(n[2]), w = Math.max(5, n[1]*ppb - 2), s = st.get(n[0].toFixed(3)+":"+n[2]);
    c.globalAlpha = s === "orn" ? .35 : 1;
    c.fillStyle = !R ? (n[3] === 0 ? col("--pink") : col("--sky")) : s === "ok" ? col("--mint") : s === "miss" ? col("--card") : col("--line");
    c.strokeStyle = s === "miss" ? col("--pink") : "transparent"; c.lineWidth = 2.5;
    c.beginPath(); c.roundRect ? c.roundRect(x, y, w, Math.max(4, rowH-1), 3) : c.rect(x, y, w, Math.max(4, rowH-1)); c.fill(); if(s === "miss") c.stroke(); c.globalAlpha = 1; });
  if(R){ c.fillStyle = col("--ink2"); R.pairs.forEach(([i,j]) => { if(i >= 0 || j < 0) return; const bt = timeToBeat(R, R.P[j].t); if(bt == null || bt < from || bt > to) return;
    R.P[j].ms.forEach(m => { if(m >= lo && m <= hi){ c.beginPath(); c.arc(X(bt), Y(m) + rowH/2, 3.5, 0, 7); c.fill(); } }); }); }
  if(playBeat != null){ c.strokeStyle = col("--ink"); c.lineWidth = 2; c.beginPath(); c.moveTo(X(playBeat), 14); c.lineTo(X(playBeat), H); c.stroke();
    const sx = X(playBeat) - wrap.clientWidth/2; if(Math.abs(wrap.scrollLeft - sx) > 40) wrap.scrollLeft = Math.max(0, sx); }
}
// 녹음 시각(초) → 악보 박: 앞뒤로 맞춘 음 사이를 이어서 계산한다 (멈칫한 곳도 따라간다)
function timeToBeat(R, t){
  const m = R.pairs.filter(([i,j]) => i >= 0 && j >= 0).map(([i,j]) => [R.P[j].t, R.E[i].beat]); if(!m.length) return null;
  if(t <= m[0][0]) return m[0][1] - (m[0][0]-t)/R.spb;
  for(let k=1;k<m.length;k++) if(t <= m[k][0]){ const [t0,b0] = m[k-1], [t1,b1] = m[k]; return t1 > t0 ? b0 + (b1-b0)*(t-t0)/(t1-t0) : b1; }
  const [tl, bl] = m[m.length-1]; return bl + (t-tl)/R.spb;
}
function reportHtml(){

    ${(() => { const h = barHistory(LV.piece.id), ch = R.bars.map(b => { const hs = h[b.bar] || []; return hs.length >= 2 ? {b:b.bar, from:hs[hs.length-2].s, to:hs[hs.length-1].s} : null; }).filter(x => x && Math.abs(x.to - x.from) >= 5);
      return ch.length ? `<div><div class="muted" style="font-size:13px;margin-bottom:4px">지난번보다</div>${ch.map(x => `<span class="pill" style="margin:0 6px 6px 0">${x.b}마디 ${x.from}→${x.to} ${x.to > x.from ? "▲" : "▼"}</span>`).join("")}</div>` : ""; })()}

      ${A.weak.length ? `<button class="btn alt" style="margin-top:8px" data-plan="${A.weak[0].bar}-${A.weak[0].bar}-${Math.max(40, Math.round(R.bpm*.7/4)*4)}">${A.weak[0].bar}마디만 천천히 녹음하기</button>`
        : LV.b < LV.piece.bars.length ? `<button class="btn alt" style="margin-top:8px" data-plan="${LV.a}-${Math.min(LV.piece.bars.length, LV.b+4)}-${LV.bpm}">${LV.a}~${Math.min(LV.piece.bars.length, LV.b+4)}마디로 늘리기</button>` : ""}</div>

    <p class="muted" style="font-size:12px;margin:0">솜이가 녹음을 듣고 받아 적은 결과라 가끔 틀리게 들을 수 있어요. 낮은 왼손 음과 꾸밈음은 특히 헷갈려요.</p></div>`;

document.addEventListener("timeupdate", e => { if(e.target.id === "takeaudio" && LV.result) drawRoll(timeToBeat(LV.result, e.target.currentTime + LV.result.recOffset)); }, true);

/* 녹음: 마이크 소리를 그대로 모았다가(ScriptProcessor) 22050Hz로 바꿔 Basic Pitch에 넘긴다 */
const Rec = {stream:null, node:null, src:null, chunks:[], sr:44100, heard:false, quiet:0, t0:0, timer:0, wake:null};
async function recStart(){
  const a = audio(); if(!a || !navigator.mediaDevices?.getUserMedia){ LV.msg = "이 브라우저에서는 녹음이 안 돼요. '녹음 파일 올리기'를 써 주세요."; return renderLabAction(); }
  micStop();
  try{ Rec.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}}); }
  catch(e){ LV.msg = "녹음이 막혔어요. claude.ai 링크 안에서는 마이크를 못 써요. 휴대폰 주소(johnjang125.github.io/somi-piano)에서 열거나, 휴대폰 녹음 앱으로 녹음한 파일을 올려 주세요."; return renderLabAction(); }
  try{ Rec.wake = await navigator.wakeLock?.request("screen"); }catch(e){}
  Object.assign(Rec, {chunks:[], sr:a.sampleRate, heard:false, quiet:0, t0:a.currentTime});
  Rec.src = a.createMediaStreamSource(Rec.stream); Rec.node = a.createScriptProcessor(4096, 1, 1);
  Rec.node.onaudioprocess = e => { const d = e.inputBuffer.getChannelData(0); Rec.chunks.push(new Float32Array(d));
    let s = 0; for(let i=0;i<d.length;i++) s += d[i]*d[i]; const rms = Math.sqrt(s/d.length), lv = $("#reclv"); if(lv) lv.style.width = Math.min(100, rms*600) + "%";
    const secs = Rec.chunks.length*4096/Rec.sr;
    if(secs > 2.4 && rms > .02) Rec.heard = true;
    Rec.quiet = Rec.heard && rms < .006 ? Rec.quiet + 4096/Rec.sr : 0;
    if(Rec.quiet > 4 || secs > 150) recStop(false); };
  Rec.src.connect(Rec.node); Rec.node.connect(a.destination);
  LV.phase = "rec"; LV.result = null; renderLabAction();
  // 4박 세기 (첫 박은 쿵)
  const spb = 60/LV.bpm; let k = 0;
  const tick = () => { if(LV.phase !== "rec") return; const big = $("#recbig");
    if(k < 4){ drum(k === 0, true); if(big) big.textContent = 4 - k; k++; Rec.timer = setTimeout(tick, spb*1000); }
    else { if(big) big.textContent = "🎹"; const t = $("#rectxt"); if(t) t.textContent = `녹음 중 · ${LV.a}~${LV.b}마디를 쳐 봐!`; } };
  tick();
}
function recStop(cancel){
  clearTimeout(Rec.timer);
  if(!Rec.stream){ return; }
  try{ Rec.node.disconnect(); Rec.src.disconnect(); }catch(e){}
  Rec.stream.getTracks().forEach(t => t.stop()); Rec.stream = null; try{ Rec.wake?.release(); }catch(e){} Rec.wake = null;
  if(cancel){ if(LV.phase === "rec") LV.phase = "setup"; return; }
  const len = Rec.chunks.reduce((a,c)=>a+c.length,0), all = new Float32Array(len); let o = 0; Rec.chunks.forEach(c => { all.set(c, o); o += c.length; }); Rec.chunks = [];
  if(len < Rec.sr*3){ LV.phase = "setup"; LV.msg = "녹음이 너무 짧아요. 다시 해 볼까?"; return renderLab(); }
  analyzeAudio(all, Rec.sr);
}
async function analyzeFile(file){
  LV.phase = "busy"; LV.msg = "녹음 파일을 여는 중…"; renderLabAction();
  try{ const buf = await audio().decodeAudioData(await file.arrayBuffer()), ch = buf.numberOfChannels, mono = new Float32Array(buf.length);
    for(let c=0;c<ch;c++){ const d = buf.getChannelData(c); for(let i=0;i<d.length;i++) mono[i] += d[i]/ch; }
    analyzeAudio(mono, buf.sampleRate);
  }catch(e){ LV.phase = "setup"; LV.msg = "이 파일은 열 수 없어요. m4a, mp3, wav 녹음 파일을 올려 주세요."; renderLab(); }
}
async function to22k(data, sr){
  const n = Math.ceil(data.length * 22050 / sr), oc = new OfflineAudioContext(1, n, 22050), b = oc.createBuffer(1, data.length, sr);
  b.getChannelData(0).set(data); const s = oc.createBufferSource(); s.buffer = b; s.connect(oc.destination); s.start(); return (await oc.startRendering()).getChannelData(0);
}
function wavUrl(f32){
  const n = f32.length, buf = new ArrayBuffer(44 + n*2), v = new DataView(buf), w = (o, s) => [...s].forEach((ch,i) => v.setUint8(o+i, ch.charCodeAt(0)));
  w(0,"RIFF"); v.setUint32(4, 36+n*2, true); w(8,"WAVEfmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,22050,true); v.setUint32(28,44100,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) v.setInt16(44+i*2, Math.max(-1, Math.min(1, f32[i]))*32767, true);
  return URL.createObjectURL(new Blob([buf], {type:"audio/wav"}));
}
async function analyzeAudio(data, sr){
  LV.phase = "busy"; LV.msg = "솜이가 녹음을 듣는 중… (처음엔 준비하느라 조금 걸려)"; renderLabAction();
  const prog = p => { const b = $("#busylv"); if(b) b.style.width = Math.round(p*100) + "%"; const t = $("#busytxt"); if(t) t.textContent = `솜이가 듣고 받아 적는 중… ${Math.round(p*100)}%`; };
  try{
    const [bp, a22] = await Promise.all([loadBP(), to22k(data, sr)]);
    if(LV.take) URL.revokeObjectURL(LV.take); LV.take = wavUrl(a22);
    const notes = await bp.transcribe(a22, "bp/model.json", prog);
    const R = analyzeTake(LV.piece, LV.a, LV.b, LV.hand, notes); R.recOffset = 0;
    if(R.pairs.every(([i,j]) => i < 0 || j < 0)){ LV.phase = "setup"; LV.msg = "피아노 소리를 거의 못 들었어요. 휴대폰을 피아노에 더 가까이 두고 다시 녹음해 볼까?"; return renderLab(); }
    LV.result = R; LV.advice = adviseTake(LV.piece, R, LV.a, LV.b); LV.phase = "setup"; LV.msg = ""; LV.selBar = null;
    saveTake(R);

  }catch(e){ LV.phase = "setup"; LV.msg = "분석 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요. claude.ai 링크에서는 녹음 분석이 안 되니 휴대폰 주소(johnjang125.github.io/somi-piano)에서 열어 주세요."; renderLab(); }
}
function saveTake(R){
  const k = dkey(), d = today(), rec = labRec(LV.piece.id), wasGoal = (d.xp||0) >= S.settings.goal, wasAll = allDone(k);
  rec.takes.push({d:k, a:LV.a, b:LV.b, hand:LV.hand, score:R.score, acc:Math.round(R.acc*100), bpm:LV.bpm, bars:Object.fromEntries(R.bars.map(b=>[b.bar, b.score]))}); if(rec.takes.length > 40) rec.takes.shift();
  d.sessions++; d.missions.lesson = true; d.missions.piece = true;
  const xp = 15 + Math.round(R.score/10); d.xp = (d.xp||0) + xp; S.xp += xp; let gems = 2 + (R.score >= 90 ? 2 : 0);
  if(!wasGoal && d.xp >= S.settings.goal) gems += 5; S.gems += gems;
  ["first","recorder"].forEach(id => { if(!S.stickers.includes(id)) S.stickers.push(id); });
  if(R.bars.every(b => b.color === "g") && !S.stickers.includes("allgreen")) S.stickers.push("allgreen");
  S.log.push({d:k, t:`${LV.piece.title} ${LV.a}~${LV.b}마디 녹음`, s:R.score >= 90 ? 3 : R.score >= 70 ? 2 : 1, a:Math.round(R.acc*100)});
  save(); toast(`⭐ +${xp} XP · 💎 +${gems}`);
}

/* ---------- 반짝이 효과 ---------- */
const fx = $("#fx"), fc = fx.getContext("2d"); let parts = [], fxOn = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function spawn(x,y,n,colors,spread){ if(reduce.matches) return; for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = spread*(.4+Math.random());
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v - spread*.6,life:1,c:colors[i%colors.length],r:4+Math.random()*5,rot:Math.random()*6}); } if(!fxOn){ fxOn = true; requestAnimationFrame(tick); } }
function burst(el,col){ const r = el.getBoundingClientRect(); const css = getComputedStyle(document.documentElement); spawn(r.left+r.width/2, r.top+20, 12, [resolve(col,css), css.getPropertyValue("--butter").trim()], 4); }
function resolve(col,css){ const m = /var\((--[\w-]+)\)/.exec(col); return m ? css.getPropertyValue(m[1]).trim() : col; }
function confetti(){ const css = getComputedStyle(document.documentElement); spawn(innerWidth/2, innerHeight*.4, 70, ["--pink","--sky","--butter","--mint","--c-G"].map(v=>css.getPropertyValue(v).trim()), 9); }
function star(c,r){ c.beginPath(); for(let i=0;i<10;i++){ const rr = i%2 ? r*.45 : r, a = i*Math.PI/5 - Math.PI/2; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } c.closePath(); c.fill(); }
function tick(){
  const dpr = devicePixelRatio||1; if(fx.width!==innerWidth*dpr){ fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; }
  fc.setTransform(dpr,0,0,dpr,0,0); fc.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => (p.life -= .016) > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .22; p.rot += .1; fc.save(); fc.translate(p.x,p.y); fc.rotate(p.rot); fc.globalAlpha = Math.min(1,p.life*1.5); fc.fillStyle = p.c; star(fc,p.r); fc.restore(); });
  if(parts.length) requestAnimationFrame(tick); else { fxOn = false; fc.clearRect(0,0,innerWidth,innerHeight); }
}

applyFreeze(); buildKb(); go("home");
})();
