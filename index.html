<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF4F9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="솜이 피아노">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>솜이 피아노 교실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 한 화면 앱. 위에는 화면 콘텐츠, 아래에는 탭 바. 연습 화면은 탭 바를 숨기고 건반을 화면 아래에 붙인다. */
:root{
  --bg:#FFF4F9; --bg2:#F6EEFF; --card:#FFFFFF; --ink:#4A2D5C; --ink2:#8A6A99; --line:#F0D9EA;
  --pink:#FF6FAE; --pink-soft:#FFE0EE; --lilac:#A98BFF; --lilac-soft:#EEE6FF; --mint:#4FCFAE; --butter:#FFC93C;
  --key:#FFFFFF; --key-edge:#E9D3E3; --black:#3B2547; --shadow:0 6px 0 rgba(169,139,255,.18);
  --c-C:#FF5C7A; --c-D:#FF9640; --c-E:#F5C400; --c-F:#3FCB7A; --c-G:#3BAEF5; --c-A:#6E7BFF; --c-B:#B86CF5;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#21162F; --bg2:#2A1D3D; --card:#33244A; --ink:#FBEFFF; --ink2:#C9B3D8; --line:#4A3863;
  --pink-soft:#4E2944; --lilac-soft:#3B2E5C; --key:#FFF8FC; --key-edge:#BFA6C9; --black:#120A1A; --shadow:0 6px 0 rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#21162F; --bg2:#2A1D3D; --card:#33244A; --ink:#FBEFFF; --ink2:#C9B3D8; --line:#4A3863;
  --pink-soft:#4E2944; --lilac-soft:#3B2E5C; --key:#FFF8FC; --key-edge:#BFA6C9; --black:#120A1A; --shadow:0 6px 0 rgba(0,0,0,.3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 12% 8%,var(--pink-soft) 0 90px,transparent 91px),radial-gradient(circle at 92% 30%,var(--lilac-soft) 0 120px,transparent 121px);
  background-attachment:fixed;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.25}
.app{max-width:780px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
.screen{display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);border:2px solid var(--line)}
.row{display:flex;gap:12px;align-items:center}
.muted{color:var(--ink2)}
.btn{font-family:var(--display);font-size:18px;padding:12px 22px;border-radius:999px;background:var(--pink);color:#fff;box-shadow:0 4px 0 #D9478A;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9478A}
.btn.alt{background:var(--lilac);box-shadow:0 4px 0 #7D5FE0}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:default}

/* 홈 */
.hello{display:flex;gap:14px;align-items:flex-end}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:22px 22px 22px 6px;padding:14px 16px;flex:1;min-width:0;box-shadow:var(--shadow)}
.bubble b{font-family:var(--display);font-weight:400;font-size:20px;display:block;color:var(--pink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--ink2)}
.stamp{width:38px;height:38px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:20px}
.stamp.on{border:0;background:var(--pink-soft)}
.stamp.gold{border:0;background:var(--butter)}
.stamp.today{border-color:var(--pink)}
.streak{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.streak .big{font-family:var(--display);font-size:30px;color:var(--pink)}
.mission{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--bg2)}
.mission .chk{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--lilac);display:grid;place-items:center;color:#fff;font-size:18px}
.mission.done .chk{background:var(--mint);border-color:var(--mint)}
.mission .txt{flex:1;min-width:0}
.mission .txt b{font-family:var(--display);font-weight:400;font-size:18px;display:block}
.mission .txt span{font-size:14px;color:var(--ink2)}
.mission.done .txt b{text-decoration:line-through;text-decoration-color:var(--mint);text-decoration-thickness:3px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.chip b{font-family:var(--display);font-weight:400;font-size:26px;display:block;font-variant-numeric:tabular-nums}
.chip span{font-size:13px;color:var(--ink2)}
.allclear{background:linear-gradient(135deg,var(--butter),var(--pink));color:#fff;text-align:center;font-family:var(--display);font-size:20px;border-radius:18px;padding:12px}

/* 지도 */
.path{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.path::before{content:"";position:absolute;left:50%;top:30px;bottom:30px;border-left:6px dotted var(--lilac);opacity:.5;transform:translateX(-3px)}
.stop{position:relative;display:flex}
.stop:nth-child(4n+1){justify-content:center}
.stop:nth-child(4n+2){justify-content:flex-end;padding-right:8%}
.stop:nth-child(4n+3){justify-content:center}
.stop:nth-child(4n){justify-content:flex-start;padding-left:8%}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:150px;text-align:center}
.disc{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--card);border:4px solid var(--pink);box-shadow:0 6px 0 #E7559A;transition:transform .1s}
.disc:active{transform:translateY(4px);box-shadow:0 2px 0 #E7559A}
.node.locked .disc{border-color:var(--line);box-shadow:0 6px 0 var(--line);filter:grayscale(1);opacity:.6;cursor:default}
.node.next .disc{animation:bob 1.6s ease-in-out infinite}
.node .nm{font-family:var(--display);font-size:16px;line-height:1.2;background:var(--bg);padding:2px 8px;border-radius:10px}
.stars{color:var(--butter);letter-spacing:2px;font-size:16px}
.stars .off{color:var(--line)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--lilac-soft);color:var(--ink2)}
@keyframes bob{50%{transform:translateY(-6px)}}

/* 스티커 */
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.stk{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.stk .em{font-size:42px;line-height:1.2}
.stk b{font-family:var(--display);font-weight:400;font-size:15px}
.stk span{font-size:12px;color:var(--ink2);line-height:1.3}
.stk.locked .em{filter:grayscale(1) brightness(1.4);opacity:.25}
.stk.got{border-color:var(--pink);background:var(--pink-soft)}

/* 어른 */
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field textarea{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.toggle input{width:22px;height:22px;accent-color:var(--pink)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:64px 1fr 72px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:14px;background:var(--bg2);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cal div{aspect-ratio:1;border-radius:6px;background:var(--bg2);max-width:100%}
.cal .p{background:var(--pink-soft)} .cal .g{background:var(--pink)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px;max-height:220px;overflow:auto}
.log div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:4px}

/* 탭 바 */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px;border-radius:16px;font-family:var(--display);font-size:14px;color:var(--ink2)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{background:var(--pink-soft);color:var(--pink)}

/* 연습 화면 */
body.playing .tabs{display:none}
body.playing .app{padding-block:12px 12px}
.playtop{display:flex;align-items:center;gap:10px}
.x{width:44px;height:44px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:22px;display:grid;place-items:center;flex:none}
.prog{flex:1;height:18px;border-radius:99px;background:var(--bg2);overflow:hidden;border:2px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--lilac));border-radius:99px;transition:width .3s}
.ptitle{font-family:var(--display);font-size:20px;text-align:center}
.stage{position:relative;min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--card);border-radius:24px;border:2px solid var(--line);overflow:hidden}
.target{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:56px;color:#fff;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);animation:pop .35s}
.prompt{font-family:var(--display);font-size:20px;text-align:center;padding:0 12px}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
#lane{display:block;width:100%;height:260px}
.songbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.speed{display:flex;gap:4px;background:var(--bg2);border-radius:99px;padding:4px}
.speed button{padding:6px 12px;border-radius:99px;font-size:14px;font-family:var(--display)}
.speed button[aria-pressed="true"]{background:var(--card);color:var(--pink);box-shadow:0 2px 0 var(--line)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--card);z-index:2;text-align:center;padding:16px}
.staff{width:min(320px,90%);height:auto}

/* 건반 */
.kbwrap{margin-top:auto;padding-top:14px}
.kb{position:relative;display:flex;height:190px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.wk{flex:1;position:relative;background:var(--key);border:2px solid var(--key-edge);border-top:0;border-radius:0 0 14px 14px;margin:0 1px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:10px;gap:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06);transition:background .1s}
.wk .dot{width:22px;height:22px;border-radius:50%}
.wk .lb{font-family:var(--display);font-size:17px;color:#5A3D69;line-height:1}
.wk.hide-lb .lb{visibility:hidden}
.bk{position:absolute;top:0;width:7%;height:60%;background:var(--black);border-radius:0 0 10px 10px;z-index:2;box-shadow:inset 0 -6px 0 rgba(255,255,255,.12)}
.wk.down{background:var(--pink-soft);box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
.bk.down{background:#6B4A7E}
.wk.glow{animation:glow 1s ease-in-out infinite}
.bk.glow{animation:glowb 1s ease-in-out infinite}
@keyframes glow{50%{background:#FFF0A8;box-shadow:0 0 0 4px var(--butter) inset}}
@keyframes glowb{50%{background:#C9A33A}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* 결과 */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(74,45,92,.45);padding:16px}
.modal .card{max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.bigstars{font-size:52px;letter-spacing:6px}
.bigstars span{display:inline-block;color:var(--line);animation:none}
.bigstars span.on{color:var(--butter);animation:pop .5s backwards}
.newstk{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:40px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

/* 오늘의 목표 (XP 링) */
.goal{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);line-height:1.1}
.ring .num b{font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.ring .num span{font-size:12px;color:var(--ink2)}
.goal .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--bg2);font-size:14px;font-variant-numeric:tabular-nums}
.play-card{display:flex;align-items:center;gap:14px}
.play-card .em{font-size:44px;flex:none}
.play-card .txt{flex:1;min-width:0}
.combo{font-family:var(--display);font-size:16px;color:#fff;background:var(--butter);padding:4px 12px;border-radius:99px;flex:none;animation:pop .3s}
.compose{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;padding:12px 8px;box-sizing:border-box}
.staffwrap{overflow-x:auto;max-width:100%;width:100%;scroll-behavior:smooth}
.staffwrap svg{display:block}
.compose input{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:12em;max-width:100%}
.mysong{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:var(--bg2)}
.mysong .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.mysong .txt b{font-family:var(--display);font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mysong .txt span{font-size:13px;color:var(--ink2)}
.dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%}
.btn.sm{font-size:14px;padding:7px 12px;flex:none}
.micpill{font-family:var(--display);font-size:15px;padding:4px 12px;border-radius:99px;background:var(--bg2);color:var(--ink2);flex:none;transition:background .1s}
.micpill.hot{background:var(--mint);color:#fff}
.meter{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--pink));transition:width .08s}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:25;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-family:var(--display);font-size:17px;max-width:calc(100% - 32px);text-align:center;animation:pop .3s}
.reward{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* 상점 */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.item{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.item .em{font-size:40px;line-height:1.2}
.item b{font-family:var(--display);font-weight:400;font-size:17px}
.item span{font-size:13px;color:var(--ink2);line-height:1.35}
.item .btn{font-size:15px;padding:8px 16px;margin-top:auto}
.item.on{border-color:var(--pink);background:var(--pink-soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--bg);font-family:var(--display)}
.seg button[aria-pressed="true"]{border-color:var(--pink);background:var(--pink-soft);color:var(--pink)}
.xpweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.xpweek div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;color:var(--ink2)}
.xpweek i{display:block;width:70%;border-radius:8px 8px 3px 3px;background:var(--lilac);min-height:3px}
.xpweek .hit i{background:var(--pink)}
@media (max-width:480px){.kb{height:150px}.wk .lb{font-size:14px}.wk .dot{width:16px;height:16px}.disc{width:70px;height:70px;font-size:28px}.node{width:120px}#lane{height:220px}.target{width:110px;height:110px;font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <section class="screen" id="s-home"></section>
  <section class="screen" id="s-map" hidden></section>
  <section class="screen" id="s-stk" hidden></section>
  <section class="screen" id="s-shop" hidden></section>
  <section class="screen" id="s-parent" hidden></section>
  <section class="screen" id="s-play" hidden style="flex:1">
    <div class="playtop">
      <button class="x" id="quit" aria-label="그만하기">×</button>
      <div class="prog"><i id="progbar"></i></div>
      <span class="combo" id="combo" hidden></span>
      <span class="micpill" id="micpill" hidden></span>
    </div>
    <div class="ptitle" id="ptitle"></div>
    <div class="stage" id="stage"></div>
    <div class="kbwrap"><div class="kb" id="kb" aria-label="피아노 건반"></div></div>
  </section>
</div>
<div class="tabs"><nav id="tabs">
  <button class="tab" data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>오늘</button>
  <button class="tab" data-go="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z"/></svg>별나라 지도</button>
  <button class="tab" data-go="stk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>스티커북</button>
  <button class="tab" data-go="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20M9 3l3 18 3-18"/></svg>보석 상점</button>
  <button class="tab" data-go="parent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>어른 코너</button>
</nav></div>
<canvas id="fx"></canvas>

<script>
(() => {
"use strict";

const dkey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function streak(){

  while(alive(dkey(d))){ if(practiced(dkey(d))) n++; d = addDays(d,-1); }
  return n;
}
/* 앱을 열 때, 쉬었던 날을 방패로 메운다. 방패가 모자라면 기록은 새로 시작된다. */
function applyFreeze(){
  if(alive(dkey())) return;
  const gap = []; let d = addDays(new Date(),-1);
  while(!alive(dkey(d)) && gap.length < 60){ gap.push(dkey(d)); d = addDays(d,-1); }
  if(!gap.length || !alive(dkey(d))) return;
  if(gap.length <= S.freezes){
    gap.forEach(k => S.days[k] = Object.assign(S.days[k]||{sessions:0,minutes:0,missions:{}}, {frozen:true}));
    S.freezes -= gap.length;
    S.notice = ["방패가 연속 기록을 지켜 줬어!", `쉬었던 ${gap.length}일을 방패로 막았어. 오늘은 같이 쳐 보자!`];
  } else if(gap.length === 1 || streakBefore(d) >= 3) {
    S.notice = ["어제는 쉬었구나. 괜찮아!", "오늘부터 다시 하면 돼. 방패를 사 두면 쉬는 날도 기록이 지켜져."];
  }
  save();
}

function weakness(id){ const s = noteStat(id); const days = s.last ? (Date.now()-s.last)/864e5 : 3; return (s.w+1)/(s.r+s.w+2) + Math.min(days,7)*0.04; }
function learnedNotes(){

function weakest(k){ return learnedNotes().sort((a,b)=>weakness(b)-weakness(a)).slice(0,k); }
function pickWeighted(pool, avoid){
  const c = pool.length>1 ? pool.filter(n=>n!==avoid) : pool;
  const w = c.map(n => 0.5 + weakness(n)); let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<c.length;i++){ r-=w[i]; if(r<=0) return c[i]; } return c[c.length-1];
}

  const weak = learnedNotes().map(id=>({id,s:noteStat(id)})).filter(o=>o.s.r+o.s.w>=3).sort((a,b)=>(a.s.r/(a.s.r+a.s.w))-(b.s.r/(b.s.r+b.s.w)))[0];
  if(weak && weak.s.r/(weak.s.r+weak.s.w) < .75) { const nm = N[weak.id].name; return [`${eul(nm)} 가끔 헷갈리더라.`,`복습 미션에서 ${eul(nm)} 꼭 다시 찾아보자!`]; }
  if(!practiced(k) && st>0) return [`벌써 ${st}일 연속이야!`,"오늘도 조금만 치면 기록이 이어져."];

  return lines[new Date().getDate()%lines.length];
}

/* ---------- 소리 ---------- */
let ac = null;
function audio(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(ac.state==="suspended") ac.resume();
  return ac;
}
function tone(midi, dur=1.3, vol=.3, when=0){
  if(!S.settings.sound) return; const a = audio(); if(!a) return;
  const t = a.currentTime + when, f = 440*Math.pow(2,(midi-69)/12);
  // 앱이 내는 소리를 마이크가 피아노 소리로 착각하지 않게 그동안은 듣지 않는다
  if(Mic.tr) Mic.tr.st.gateUntil = Math.max(Mic.tr.st.gateUntil, performance.now() + (when + Math.min(dur,.8))*1000 + 150);
  const g = a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.008); g.gain.exponentialRampToValueAtTime(.0001,t+dur); g.connect(a.destination);
  [[1,"triangle",1],[2,"sine",.3],[3,"sine",.1],[4,"sine",.05]].forEach(([m,type,amp]) => {
    const o = a.createOscillator(), og = a.createGain(); o.type=type; o.frequency.value=f*m; og.gain.value=amp; o.connect(og); og.connect(g); o.start(t); o.stop(t+dur+.05);
  });
}
const ding = () => { tone(88,.25,.12,.05); tone(91,.35,.12,.13); };
const fanfare = () => [72,76,79,84].forEach((m,i)=>tone(m,.6,.18,i*.12));

}

/* 마이크로 진짜 피아노 소리 듣기.
   음 높이: McLeod 방식(NSDF)으로 기본 주기를 찾는다. 피아노처럼 배음이 많은 소리에서 옥타브 실수가 적다.
   새로 친 음: 소리 크기가 갑자기 커지면(건반을 친 순간) 같은 음이 또 나와도 한 번 더 센다. */
function pitchOf(buf, sr, minF, maxF){
  const W = buf.length >> 1, maxT = Math.min(W-1, Math.ceil(sr/minF)), minT = Math.floor(sr/maxF);
  const n = new Float32Array(maxT+2);
  for(let t=1; t<=maxT+1; t++){ let ac = 0, m = 0; for(let i=0;i<W;i++){ const a = buf[i], b = buf[i+t]; ac += a*b; m += a*a + b*b; } n[t] = m > 0 ? 2*ac/m : 0; }
  let t = 1; while(t <= maxT && n[t] > 0) t++;
  const peaks = []; let top = 0;
  while(t <= maxT){
    while(t <= maxT && n[t] <= 0) t++;
    let bt = -1, bv = -1; while(t <= maxT && n[t] > 0){ if(n[t] > bv){ bv = n[t]; bt = t; } t++; }
    if(bt >= minT && bt > 0){ peaks.push([bt,bv]); top = Math.max(top,bv); }
  }
  const pk = peaks.find(p => p[1] >= top*0.9); if(!pk) return null;
  const [b0, v] = pk, a = n[b0-1], c = n[b0+1], d = a - 2*v + c, sh = d ? (a - c)/(2*d) : 0;
  return {freq: sr/(b0 + sh), clarity: v};
}
function makeTracker(opt){
  const st = {hist:[], armed:true, last:null, cand:null, candN:0, peak:0, rms:0, floor:opt.floor||0.002, offset:opt.offset||0, gateUntil:0};
  return {st, feed(buf, sr, now){
    let s = 0; for(let i=0;i<buf.length;i++) s += buf[i]*buf[i]; const rms = st.rms = Math.sqrt(s/buf.length);
    st.hist.push(rms); if(st.hist.length > 6) st.hist.shift();
    const ref = Math.min(...st.hist.slice(0,3));
    if(st.hist.length >= 5 && rms > st.floor*4 && rms > ref*1.6){ st.armed = true; st.cand = null; st.candN = 0; st.peak = rms; }
    st.peak = Math.max(st.peak, rms);
    if(rms < st.floor*2.5){ st.last = null; st.armed = true; st.cand = null; st.peak = 0; return null; }
    if(now < st.gateUntil) return null;
    const p = pitchOf(buf, sr, 100, 1500); if(!p || p.clarity < 0.85) return null;
    const midiF = 69 + 12*Math.log2(p.freq/440) - st.offset/100, m = Math.round(midiF);
    if(Math.abs(midiF - m) > 0.4) return null;
    if(m === st.cand) st.candN++; else { st.cand = m; st.candN = 1; }
    if(st.armed ? st.candN >= 2 : (m !== st.last && st.candN >= 4 && rms > st.peak*0.35)){ st.armed = false; st.last = m; return {m, f:p.freq, midiF}; }
    return null;
  }};
}

const Mic = {stream:null, an:null, buf:null, timer:0, tr:null, onRaw:null, heard:null, wake:null};
async function micStart(){
  if(Mic.stream) return true;
  const a = audio(); if(!a || !navigator.mediaDevices?.getUserMedia) return false;
  try{
    Mic.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    Mic.an = a.createAnalyser(); Mic.an.fftSize = 2048; a.createMediaStreamSource(Mic.stream).connect(Mic.an);
    Mic.buf = new Float32Array(2048); Mic.tr = makeTracker({floor:S.settings.micFloor||0.002, offset:S.settings.micOffset||0});
    Mic.timer = setInterval(micTick, 25);
    try{ Mic.wake = await navigator.wakeLock?.request("screen"); }catch(e){}
    return true;
  }catch(e){ micStop(); return false; }
}
function micStop(){
  clearInterval(Mic.timer); Mic.stream?.getTracks().forEach(t=>t.stop()); Mic.stream = Mic.an = Mic.tr = null; Mic.onRaw = null;
  try{ Mic.wake?.release(); }catch(e){} Mic.wake = null; micPill();
}
const foldId = m => { while(m < 60) m += 12; while(m > 76) m -= 12; return NOTES.find(x=>x.midi===m)?.id; };
function micTick(){
  if(!Mic.an) return; Mic.an.getFloatTimeDomainData(Mic.buf);
  const r = Mic.tr.feed(Mic.buf, ac.sampleRate, performance.now());
  if(r){ Mic.heard = foldId(r.m); if(Mic.onRaw) Mic.onRaw(r); else if(cur==="play" && Mic.heard) press(Mic.heard, true, true); }
  micPill();
}
function micPill(){
  const p = $("#micpill"); if(!p) return; p.hidden = !Mic.stream || cur!=="play"; if(p.hidden) return;
  p.classList.toggle("hot", Mic.tr && Mic.tr.st.rms > Mic.tr.st.floor*4);
  p.textContent = "🎤 " + (Mic.heard ? N[Mic.heard].short || N[Mic.heard].name : "듣는 중");
}
/* 소리 맞추기: 조용할 때 잡음 크기를 재고, 가운데 도를 3번 들어 피아노 조율이 얼마나 어긋났는지 잰다 */
let calTimer = 0;
async function calibrate(){
  const msg = t => { const m = $("#calmsg"); if(m) m.textContent = t; }, meter = $("#calmeter");
  clearTimeout(calTimer); micStop();
  if(!(await micStart())){ msg(micErr); return; }
  Mic.tr.st.offset = 0; meter.hidden = false;
  const levels = [], sh = setInterval(() => { if(!Mic.tr){ clearInterval(sh); return; } meter.firstElementChild.style.width = Math.min(100, Mic.tr.st.rms*800) + "%"; levels.push(Mic.tr.st.rms); }, 50);
  msg("1. 잠깐 조용히 해 주세요…");
  await new Promise(r => setTimeout(r, 1500));
  if(!Mic.tr) return;
  const sorted = levels.slice().sort((a,b)=>a-b), floor = Math.max(0.0005, sorted[Math.floor(sorted.length/2)]*1.5);
  Mic.tr.st.floor = floor;
  msg("2. 피아노 가운데 '도'를 천천히 3번 쳐 주세요 (0 / 3)");
  const cents = [];
  Mic.onRaw = r => { if(N[foldId(r.m)]?.letter !== "C") return;
    const x = 1200*Math.log2(r.f/261.6256); cents.push(x - 1200*Math.round(x/1200)); ding();
    msg(`2. 피아노 가운데 '도'를 천천히 3번 쳐 주세요 (${cents.length} / 3)`);
    if(cents.length < 3) return;
    clearTimeout(calTimer); cents.sort((a,b)=>a-b);
    S.settings.micOffset = Math.round(cents[1]); S.settings.micFloor = floor; S.settings.mic = true; save();
    Mic.tr.st.offset = S.settings.micOffset; const c = S.settings.micOffset;
    msg(`다 맞췄어요! ${Math.abs(c) < 10 ? "피아노 조율이 잘 돼 있어요." : `피아노가 ${Math.abs(c)}센트 ${c<0?"낮게":"높게"} 조율돼 있어서 그만큼 맞춰 둘게요.`} 아무 건반이나 쳐서 확인해 보세요.`);
    const box = $("#micon"); if(box) box.checked = true;
    Mic.onRaw = r2 => { const id = foldId(r2.m); if(id) msg(`들린 음: ${N[id].name}`); };
  };
  calTimer = setTimeout(() => { if(cents.length < 3 && Mic.tr){ msg("도 소리가 잘 안 들려요. 휴대폰을 피아노 가까이 두고 '소리 맞추기'를 다시 눌러 주세요."); micStop(); meter.hidden = true; } }, 25000);
}

let midiName = "";
function connectMidi(){
  const say = t => { const m = $("#midimsg"); if(m) m.textContent = t; };
  if(!navigator.requestMIDIAccess){ say("이 브라우저는 미디 연결을 지원하지 않아요. 크롬이나 엣지를 써 주세요."); return; }
  navigator.requestMIDIAccess().then(acc => {
    const hook = () => { const ins = [...acc.inputs.values()]; ins.forEach(i => i.onmidimessage = onMidi); midiName = ins.map(i=>i.name).join(", ");
      say(ins.length ? `${midiName} 연결됐어요. 연습 화면에서 피아노를 치면 바로 인식해요.` : "연결된 피아노가 없어요. USB 선을 꽂고 다시 눌러 주세요.");
      const b = $("#midi"); if(b && midiName) b.textContent = "연결됨: " + midiName; };
    acc.onstatechange = hook; hook();
  }, () => say("브라우저가 연결을 막았어요. claude.ai 링크 말고 index.html 파일을 크롬에서 직접 열어 주세요."));
}
function onMidi(e){
  const [st, note, vel] = e.data; if((st & 0xf0) !== 0x90 || !vel) return;

  const n = NOTES.find(x=>x.midi===m); if(n && cur==="play") press(n.id, true);
}

function staffSeqSvg(ids, hi=-1){

/* 노래: 음표가 위에서 떨어지고, 맞는 건반을 누를 때까지 기다려 준다 (Orfeo의 '한 음씩 따라가기' 방식) */

/* 소절별 실수 기록: 틀린 소절은 올라가고, 깨끗하게 친 소절은 내려간다. 0이 되면 복습에서 빠진다. */

  const arr = S.phrases[A.song] = S.phrases[A.song] || A.phr.map(()=>0);
  A.phr.forEach(([a,b],p) => { if(a < A.offset || b > A.offset + A.seq.length) return; arr[p] = A.pm[p] ? Math.min(3,(arr[p]||0)+1) : Math.max(0,(arr[p]||0)-1); });

/* 음표 풍선 (Piano Drills의 Note Invaders 같은 놀이) */
const BALLOON_SECS = 45;
function balloonSetup(){
  A.balloons = []; A.left = BALLOON_SECS; A.spawn = 0; A.escaped = 0;
  $("#stage").innerHTML = `<canvas id="lane"></canvas><div class="prompt" style="padding-bottom:10px" id="bs">터뜨린 풍선 0개</div>`;
  let last = performance.now();
  const loop = now => { const dt = Math.min(.05,(now-last)/1000); last = now; if(!A || A.kind!=="balloon" || !A.running) return;
    const cv = $("#lane"), h = cv.clientHeight, el = BALLOON_SECS - A.left;
    A.left -= dt; A.spawn -= dt; setProg(el/BALLOON_SECS);
    if(A.spawn <= 0 && A.left > 2){ A.spawn = Math.max(.9, 1.9 - el*.025); A.balloons.push({note:pickWeighted(A.notes), x:.1+Math.random()*.8, y:h+40, v:h/(6.5 - Math.min(2, el*.04)), wob:Math.random()*6}); }

  if(cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const c = cv.getContext("2d"), css = getComputedStyle(document.documentElement); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  c.font = `22px ${css.getPropertyValue("--display")}`; c.textAlign = "center"; c.textBaseline = "middle";
  A.balloons.forEach(b => { const x = b.x*w + Math.sin(b.wob)*8, y = b.y, col = css.getPropertyValue("--c-"+N[b.note].letter).trim();
    c.strokeStyle = css.getPropertyValue("--ink2").trim(); c.lineWidth = 1.5; c.beginPath(); c.moveTo(x,y+30); c.quadraticCurveTo(x+6,y+45,x,y+60); c.stroke();

function balloonKey(id, el){

/* ---------- 끝, 보상 ---------- */
function finish(){
  cancelAnimationFrame(raf); glow(null); A.running = false; $("#combo").hidden = true;
  const total = A.kind==="song" ? A.seq.length : A.kind==="balloon" ? Math.max(1, A.right+A.escaped+A.wrong) : A.rounds, acc = A.right/total;
  const stars = A.kind==="balloon" ? (A.right>=18 ? 3 : A.right>=11 ? 2 : 1) : acc>=.9 ? 3 : acc>=.7 ? 2 : 1;
  const d = today(), k = dkey(), wasAll = allDone(k), before = new Set(S.stickers), goal = S.settings.goal, wasGoal = (d.xp||0) >= goal;
  d.sessions++; d.minutes += (Date.now()-A.t0)/60000;
  if(A.lessonId) S.stars[A.lessonId] = Math.max(S.stars[A.lessonId]||0, stars);

  const xp = 10 + (stars===3?5:0) + (A.wrong===0?5:0) + Math.floor(A.maxCombo/5);

  S.log.push({d:k, t:A.title, s:stars, a:Math.round(acc*100)}); if(S.log.length>300) S.log.shift();
  const give = id => { if(!S.stickers.includes(id)) S.stickers.push(id); };
  give("first"); if(A.wrong===0) give("perfect"); if(A.lessonId && stars===3) give(A.lessonId);
  if(allDone(k)) give("mission1");
  const st = streak(); [[3,"s3"],[7,"s7"],[14,"s14"],[30,"s30"]].forEach(([n,id])=>{ if(st>=n) give(id); });
  const td = totalDays(); if(td>=5) give("d5"); if(td>=15) give("d15");
  save();

  const msg = stars===3 ? "완벽해! 솜이가 깜짝 놀랐어" : stars===2 ? "아주 잘했어! 조금만 더 하면 별 3개!" : "끝까지 해낸 게 제일 멋져. 다시 하면 더 잘할 거야";
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="card" role="dialog" aria-label="결과">${bunny(84)}<h2>${msg}</h2>
    <div class="bigstars">${[1,2,3].map(n=>`<span class="${n<=stars?"on":""}" style="animation-delay:${n*.18}s">★</span>`).join("")}</div>
    <div class="muted">${A.kind==="balloon" ? `풍선 ${A.right}개를 터뜨렸어!` : `${total}개 중 ${A.right}개를 한 번에 맞혔어`}${A.maxCombo>=3?` · 최고 콤보 ${A.maxCombo}`:""}</div>
    <div class="reward"><span class="pill">⭐ +${xp} XP</span><span class="pill">💎 +${gems}</span></div>
    ${goalNow ? `<div class="allclear" style="width:100%;background:linear-gradient(135deg,var(--mint),var(--lilac))">오늘 목표 ${goal} XP 달성! 보석 5개 더</div>` : ""}
    ${chest ? `<div class="allclear" style="width:100%">오늘 미션 모두 완료! 왕관 스탬프와 보석 상자 💎10</div>` : ""}
    ${fresh.length ? `<div><b style="font-family:var(--display);font-weight:400">새 스티커!</b><div class="newstk">${fresh.map(s=>`<span title="${s[2]}">${s[1]}</span>`).join("")}</div></div>` : ""}
    <div class="row" style="flex-wrap:wrap;justify-content:center"><button class="btn ghost" id="again">한 번 더</button><button class="btn" id="home">좋아!</button></div></div>`;
  document.body.appendChild(m); fanfare(); confetti();
  const cfg = {...A}; ["round","right","wrong","wrongThis","combo","maxCombo","running","lock","seq","idx","t","miss","target","phr","pm","offset","balloons","left","spawn","escaped"].forEach(x=>delete cfg[x]);
  m.querySelector("#again").onclick = () => { m.remove(); startActivity(cfg); };
  m.querySelector("#home").onclick = () => { m.remove(); go(A && A.lessonId && !A.mission ? "map" : "home"); };
}

/* ---------- 반짝이 효과 ---------- */
const fx = $("#fx"), fc = fx.getContext("2d"); let parts = [], fxOn = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function spawn(x,y,n,colors,spread){ if(reduce.matches) return; for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = spread*(.4+Math.random());
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v - spread*.6,life:1,c:colors[i%colors.length],r:4+Math.random()*5,rot:Math.random()*6}); } if(!fxOn){ fxOn = true; requestAnimationFrame(tick); } }
function burst(el,col){ const r = el.getBoundingClientRect(); const css = getComputedStyle(document.documentElement); spawn(r.left+r.width/2, r.top+20, 12, [resolve(col,css), css.getPropertyValue("--butter").trim()], 4); }
function resolve(col,css){ const m = /var\((--[\w-]+)\)/.exec(col); return m ? css.getPropertyValue(m[1]).trim() : col; }
function confetti(){ const css = getComputedStyle(document.documentElement); spawn(innerWidth/2, innerHeight*.4, 70, ["--pink","--lilac","--butter","--mint","--c-G"].map(v=>css.getPropertyValue(v).trim()), 9); }
function star(c,r){ c.beginPath(); for(let i=0;i<10;i++){ const rr = i%2 ? r*.45 : r, a = i*Math.PI/5 - Math.PI/2; c.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } c.closePath(); c.fill(); }
function tick(){
  const dpr = devicePixelRatio||1; if(fx.width!==innerWidth*dpr){ fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; }
  fc.setTransform(dpr,0,0,dpr,0,0); fc.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => (p.life -= .016) > 0);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .22; p.rot += .1; fc.save(); fc.translate(p.x,p.y); fc.rotate(p.rot); fc.globalAlpha = Math.min(1,p.life*1.5); fc.fillStyle = p.c; star(fc,p.r); fc.restore(); });
  if(parts.length) requestAnimationFrame(tick); else { fxOn = false; fc.clearRect(0,0,innerWidth,innerHeight); }
}

applyFreeze(); buildKb(); go("home");
})();
</script>
